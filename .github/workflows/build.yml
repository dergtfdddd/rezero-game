name: Android CI

on:
  push:
    branches: [ "main", "master" ] # Запуск сборки при каждом обновлении кода
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Проверяем код репозитория
      uses: actions/checkout@v4

    - name: Устанавливаем Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Предоставляем права на запуск gradlew
      run: chmod +x gradlew

    - name: Сборка APK через Gradle
      run: ./gradlew assembleDebug

    - name: Загрузка готового APK в облако
      uses: actions/upload-artifact@v4
      with:
        name: ReZero-Game-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
