name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Проверяем код репозитория
      uses: actions/checkout@v4

    - name: Устанавливаем Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Устанавливаем Android NDK
      uses: android-actions/setup-android@v3
      with:
        ndk-version: '21.4.7075529'

    - name: Настраиваем Gradle 5.6.4
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 5.6.4

    - name: Сборка APK через глобальный Gradle
      run: gradle assembleDebug

    - name: Загрузка готового APK в облако
      uses: actions/upload-artifact@v4
      with:
        name: rezero-game-debug
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/*.apk
