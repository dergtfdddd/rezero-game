apply plugin: 'com.android.application'

android {
    // Указываем стабильные версии инструментов для старого Gradle 5.6.4
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.dergtfdddd.rezero"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 1
        versionName "1.0"

        // Принудительно собираем под нужные архитектуры процессоров
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // Включаем прямую компиляцию твоего C++ кода через Android NDK
    externalNativeBuild {
        ndkBuild {
            // Указываем путь к главному конфигурационному файлу твоего C++ кода
            path 'src/main/jni/Android.mk'
        }
    }

    // Настраиваем пути, чтобы Gradle не потерял картинки и библиотеки
    sourceSets {
        main {
            // Где искать готовые или сторонние .so библиотеки
            jniLibs.srcDirs = ['src/main/jniLibs', 'libs']
            // Где лежат пиксельные текстуры, карты уровней и шрифты игры
            assets.srcDirs = ['src/main/assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true // Позволяет отлаживать C++ код при вылетах
        }
    }
}

dependencies {
    // Минимальный набор библиотек для работы Android-окна
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
}
